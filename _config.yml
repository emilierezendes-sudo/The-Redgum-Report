# Jekyll config. GitHub Pages reads this and builds the site on every push.
# You should not need to edit this file.

title: The Redgum Report
description: Family dispatches, book reviews, and photo journal from The Redgum Report.

# The subscribe box that appears at the bottom of every page. Its wording is in
# _includes/subscribe.md; these are the Buttondown account and the field labels.
buttondown_user: TheRedgumReport
subscribe_placeholder: you@email.com
subscribe_button: Subscribe

# Turn straight quotes and -- into proper typographic quotes and dashes
markdown: kramdown
kramdown:
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]

# Each file in _authors/ is one Author of the Month entry. They don't get their
# own pages; book-review-archive.html gathers them all, ordered by `order`.
collections:
  authors:
    output: false

# Files kept in the repo but not published to the website
exclude:
  - HOW-TO-UPDATE.md
  - README.md
