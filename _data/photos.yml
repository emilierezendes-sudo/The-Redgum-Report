# ─────────────────────────────────────────────────────────────────────────────
# The photo journal, laid out like a scrapbook page. Entries appear in this
# order, packing together in columns.
#
# There are two kinds of entry.
#
# ── A PHOTO ──────────────────────────────────────────────────────────────────
#   file      the filename in uploads/  (lowercase, ~1200px is plenty)
#   caption   the handwritten note under it. Optional - leave it out for none.
#   shape     leave this off and the whole photo is shown, uncropped, whatever
#             shape it is. That's usually what you want on a scrapbook page.
#             Add one of these only if you'd rather crop it to a set shape:
#               square  → square
#               wide    → wide letterbox
#               tall    → upright rectangle
#   position  only matters when `shape` is set, and only if the crop is cutting
#             the wrong part: '50% 20%' keeps more of the top,
#             '50% 80%' more of the bottom.
#   featured  true = also appears in the row on the home page (first four used)
#
# ── A NOTE ───────────────────────────────────────────────────────────────────
#   note      the little heading, e.g. "This Month" or "Currently Reading"
#   lines     a bulleted list underneath (optional)
#   text      a paragraph or two instead of a list (optional)
#
# Notes sit in among the photos wherever you put them in this list. Move an
# entry up or down to move it on the page.
# ─────────────────────────────────────────────────────────────────────────────

- file: photo-journal-1.webp
  caption: Bouncing down the mountain at sunset
  featured: true

- file: photo-journal-2.webp
  caption: Corduroy in Yosemite
